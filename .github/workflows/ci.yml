name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node is pinned in .nvmrc. Golden-file layout tests are exactly the kind of thing
      # that produces spurious diffs when number formatting drifts across versions.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Package boundaries
        run: pnpm boundaries

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test
