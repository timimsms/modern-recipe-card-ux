<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track 01 — CSS Grid reference renderer</title>
    <link rel="stylesheet" href="../../packages/tokens/tokens.css" />
    <link rel="stylesheet" href="src/card.css" />
  </head>
  <body>
    <main class="page">
      <div class="controls">
        <label
          >recipe
          <select id="recipe"></select
        ></label>
        <label>
          view
          <select id="view">
            <option value="chart">wall chart</option>
            <option value="condensed">condensed chart</option>
            <option value="ingredients">ingredient-led</option>
            <option value="cook">cook mode</option>
            <option value="filmstrip">mini-map filmstrip</option>
          </select>
        </label>
        <label>
          columns
          <select id="strategy">
            <option value="right-packed">right-packed</option>
            <option value="left-packed">left-packed</option>
            <option value="stretch-to-merge">stretch-to-merge</option>
          </select>
        </label>
        <label>
          reuse
          <select id="reuse">
            <option value="chip">chip</option>
            <option value="connector">connector</option>
            <option value="duplicate-leaf">duplicate-leaf</option>
          </select>
        </label>
        <label>
          marks
          <select id="markrule">
            <option value="fixed">◷ always means unattended</option>
            <option value="relative">mark whichever is the minority</option>
          </select>
        </label>
        <label>
          shading
          <select id="ramp">
            <option value="accumulating">darkest at the finished dish</option>
            <option value="converging">lightest at the finished dish</option>
          </select>
        </label>
        <label>
          servings
          <select id="scale">
            <option value="0.5">half</option>
            <option value="1" selected>as written</option>
            <option value="1.5">1½×</option>
            <option value="2">double</option>
            <option value="3">triple</option>
            <option value="4">4×</option>
          </select>
        </label>
        <!-- Presets cover the common cases; the number covers "I have 5 people coming". -->
        <label>
          ×
          <input id="scale-any" type="number" min="0.25" max="8" step="0.25" value="1" />
        </label>
        <label>
          units
          <select id="units">
            <option value="both">both</option>
            <option value="imperial">imperial</option>
            <option value="metric">metric</option>
          </select>
        </label>
        <label><input type="checkbox" id="grey" /> greyscale</label>
        <label>
          theme
          <select id="theme">
            <option value="light">light</option>
            <option value="dark">dark</option>
          </select>
        </label>
        <!-- Kitchen affordances, not view options: they act on your progress rather than on how
             it is drawn. Start-over is a two-tap confirm because losing an hour of check-offs to
             a mis-tap is the one unrecoverable thing here. -->
        <span class="control-group">
          <button type="button" id="undo" disabled>Undo</button>
          <button type="button" id="startover">Start over</button>
        </span>
      </div>
      <div id="cards"></div>
    </main>
    <!-- Serve with `pnpm serve`, which sends no-store. A plain static server will hand you a
         cached module or stylesheet after an edit, because this track has no build step and
         nothing fingerprints the filenames. -->
    <script type="module">
      import('./src/main.js').catch((error) => {
        document.getElementById('cards').innerHTML =
          `<pre class="failure">${error.stack ?? error.message}</pre>`
      })
    </script>
  </body>
</html>
